server:
  port: ${API_GATEWAY_PORT:8080}
  shutdown: graceful

tradeapp:
  cors:
    allowed-origins: ${tradeapp_ALLOWED_ORIGINS:https://tradeapp.nishusinha.in,https://www.tradeapp.nishusinha.in}

spring:
  cloud:
    gateway:
      httpclient:
        connect-timeout: ${GATEWAY_CONNECT_TIMEOUT_MS:3000}
        response-timeout: ${GATEWAY_RESPONSE_TIMEOUT:10s}

management:
  endpoint:
    gateway:
      access: read-only

springdoc:
  swagger-ui:
    disable-swagger-default-url: true
