server:
  port: ${AUTH_SERVICE_PORT:8081}

spring:
  datasource:
    url: ${AUTH_DB_URL:jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5431}/${POSTGRES_DB:tradex_db}}
    username: ${AUTH_DB_USERNAME:${POSTGRES_USER}}
    password: ${AUTH_DB_PASSWORD:${POSTGRES_PASSWORD}}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect


springdoc:
  packages-to-scan: in.nishu.tradex.auth_service.controller

management:
  endpoints:
    web:
      exposure:
        include: health,info
